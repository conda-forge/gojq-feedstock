schema_version: 1

context:
  version: "0.12.20"

package:
  name: gojq
  version: ${{ version }}

source:
  url: https://github.com/itchyny/gojq/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7a52db203c779c88eea3ad70d6e7f10daac804e0def4198a5766a41bf6f00141

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - gojq --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Pure Go implementation of jq
  homepage: https://github.com/itchyny/gojq
  repository: https://github.com/itchyny/gojq

extra:
  recipe-maintainers:
    - danielnachun
